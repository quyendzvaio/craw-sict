name: CD
# Deploy thủ công sau khi điền keys (.env trên VM1):
#   Actions → CD → Run workflow → chọn vm1 / vm2 / all
# Secrets cần (repo Settings → Secrets → Actions):
#   VM1_HOST, VM1_KEY (nội dung ~/key/vLLM.pem), VM2_HOST, VM2_KEY (~/key/vLLM_v2.pem)
on:
  workflow_dispatch:
    inputs:
      target:
        description: VM deploy
        type: choice
        options: [all, vm1, vm2]
        default: all

jobs:
  deploy-vm1:
    if: inputs.target == 'all' || inputs.target == 'vm1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack code
        run: tar czf /tmp/sict-deploy.tgz --exclude=.venv --exclude=.pgdata
          --exclude=__pycache__ --exclude=.ruff_cache --exclude=_local_store
          --exclude=.git --exclude='*.log' --exclude='*.pt' --exclude='.lock*' .
      - name: Upload tarball
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM1_HOST }}
          username: ubuntu
          key: ${{ secrets.VM1_KEY }}
          source: /tmp/sict-deploy.tgz
          target: ~/
      - name: Build + restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM1_HOST }}
          username: ubuntu
          key: ${{ secrets.VM1_KEY }}
          script: |
            set -euo pipefail
            mv ~/tmp/sict-deploy.tgz ~/sict-deploy.tgz
            cd ~/craw-sict && tar xzf ~/sict-deploy.tgz
            docker compose up -d postgres redis qdrant
            docker compose build api
            docker compose up -d api
            docker exec -u 0 craw-sict-api-1 chown -R 10000:10000 /cache/hf || true
            docker compose restart api
            sleep 25
            docker exec craw-sict-api-1 python -c "import sict_crawler.agent"
            curl -sf -m 10 http://localhost:8003/app.js -o /dev/null
            curl -sf -m 120 -X POST http://localhost:8003/query \
              -H 'Content-Type: application/json' \
              -d '{"question":"test","top_k":1}' -o /dev/null

  deploy-vm2:
    if: inputs.target == 'all' || inputs.target == 'vm2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack code
        run: tar czf /tmp/sict-deploy.tgz --exclude=.venv --exclude=.pgdata
          --exclude=__pycache__ --exclude=.ruff_cache --exclude=_local_store
          --exclude=.git --exclude='*.log' --exclude='*.pt' --exclude='.lock*' .
      - name: Upload tarball
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM2_HOST }}
          username: ubuntu
          key: ${{ secrets.VM2_KEY }}
          source: /tmp/sict-deploy.tgz
          target: ~/
      - name: Build worker + restart 24h loop
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM2_HOST }}
          username: ubuntu
          key: ${{ secrets.VM2_KEY }}
          script: |
            set -euo pipefail
            mv ~/tmp/sict-deploy.tgz ~/sict-deploy.tgz
            cd ~/craw-sict && tar xzf ~/sict-deploy.tgz
            docker build -f Dockerfile.worker -t sict-worker .
            docker build -f Dockerfile.crawl -t sict-crawl .
            docker run --rm sict-worker python -c "import sict_crawler.agent"
            docker builder prune -af || true
            [ -f ~/craw-sict/loop24h.sh ] || cat > ~/craw-sict/loop24h.sh <<'EOF'
            #!/bin/sh
            while true; do
              python -m sict_crawler.main --incremental --check-edits 500 --crawl-limit 1000 --annotate-ocr-n 2000
              echo "pass-exit:$?"
              sleep 300
            done
            EOF
            docker rm -f sict-worker-24h || true
            docker run -d --name sict-worker-24h --restart unless-stopped \
              -e SICT_CONFIG=/app/config.yaml \
              -e POSTGRES_DSN=postgresql+asyncpg://sict:sict@172.31.11.139:5432/sict_crawler \
              -e REDIS_URL=redis://172.31.11.139:6379/0 \
              -e QDRANT_HOST=172.31.11.139 -e QDRANT_TIMEOUT=120 \
              -e AWS_PROFILE=quyen-admin -e HF_HOME=/cache/hf \
              -e CRAWLER_BACKEND=auto -e OBSCURA_BIN=/usr/local/bin/obscura \
              -v /home/ubuntu/.aws:/home/app/.aws:ro -v sict-hf:/cache/hf \
              -v /home/ubuntu/craw-sict/loop24h.sh:/app/loop24h.sh:ro \
              sict-worker /bin/sh /app/loop24h.sh
            sleep 30
            docker ps --format '{{.Names}}' | grep -q sict-worker-24h
