name: release-images
# D10: image build trong CI, đẩy GHCR, tag theo commit SHA. VM chỉ pull (workflow CD), rollback = deploy tag cũ.
# Chạy khi merge vào main (hoặc bấm tay). KHÔNG deploy — chỉ tạo image.
#   ghcr.io/<owner>/sict-api:<sha>   ghcr.io/<owner>/sict-worker:<sha>   ghcr.io/<owner>/sict-embed:<sha>   (+ :main)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, embed]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sict-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sict-${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
