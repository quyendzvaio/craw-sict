# SICT Crawler Configuration
site:
  base_url: "https://sict.haui.edu.vn"
  seed_urls:
    - "https://sict.haui.edu.vn/vn"
    - "https://sict.haui.edu.vn/vn/tin-tuc"
    - "https://sict.haui.edu.vn/vn/thong-bao"
    - "https://sict.haui.edu.vn/vn/tuyen-sinh"
    - "https://sict.haui.edu.vn/vn/nghien-cuu-khoa-hoc"
    - "https://sict.haui.edu.vn/vn/thu-vien-anh"
    - "https://sict.haui.edu.vn/vn/html/gioi-thieu"
    - "https://sict.haui.edu.vn/vn/html/bo-may-to-chuc"
    - "https://sict.haui.edu.vn/vn/html/can-bo-giang-vien"
    - "https://sict.haui.edu.vn/vn/html/khoa"
    - "https://sict.haui.edu.vn/vn/html/phong-trung-tam"
    - "https://sict.haui.edu.vn/vn/ke-hoach"
    - "https://sict.haui.edu.vn/vn/tien-do"
    - "https://sict.haui.edu.vn/vn/html/quy-che"
    - "https://sict.haui.edu.vn/vn/tuyen-dung"
    - "https://sict.haui.edu.vn/vn/guong-sang"
    - "https://sict.haui.edu.vn/vn/cau-lac-bo"
  # URL patterns to skip (assets, external)
  skip_patterns:
    - "/dnn/web/haui/assets/"
    - "/Portals/"
    - "\\.css$"
    - "\\.js$"
    - "\\.png$"
    - "\\.jpg$"
    - "\\.jpeg$"
    - "\\.svg$"
    - "\\.ico$"
    - "\\.(doc|docx|xls|xlsx|pdf|zip|rar|ppt|pptx)$"
    - "logout"
  external_hosts:
    - "www.haui.edu.vn"

crawl:
  max_depth: 5
  max_pages: 1000
  delay_seconds: 1.0
  timeout_seconds: 30
  user_agent: "SICT-RAG-Crawler/1.0 (contact: admin@haui.edu.vn)"
  respect_robots: true

postgres:
  dsn: "postgresql+asyncpg://sict:sict@localhost:5432/sict_crawler"

qdrant:
  host: "localhost"
  port: 6333
  grpc_port: 6334
  prefer_grpc: true
  collection_text: "sict_text"
  collection_image: "sict_image"
  text_dim: 384
  image_dim: 512

redis:
  url: "redis://localhost:6379/0"

celery:
  broker_url: "redis://localhost:6379/1"
  result_url: "redis://localhost:6379/2"

s3:
  bucket: "sict-crawl-media"
  region: "ap-southeast-2"
  prefix_raw: "raw/"
  prefix_media: "media/"

embedding:
  text_model: "intfloat/multilingual-e5-small"
  image_model: "openai/clip-vit-base-patch32"
  device: "cpu"
  batch_size: 32

chunking:
  min_tokens: 200
  max_tokens: 500
  overlap_ratio: 0.1
  semantic: true   # chia câu theo ranh giới ngữ nghĩa (embed e5) khi section quá budget

video:
  scene_threshold: 0.3
  max_keyframes: 20
  min_keyframes: 3
  dedup_threshold: 0.8

vlm:
  enabled: false        # annotate dùng OCR local; VLM chỉ bật lại khi upstream ổn
  api_base: "http://localhost:20128/v1"
  models:
    - "VLM"
  max_new_tokens: 128
  caption_all: false
  per_page_limit: 10

llm:
  api_base: "http://localhost:20128/v1"
  model: "sict"
  max_new_tokens: 256
