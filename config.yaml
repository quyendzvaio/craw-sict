# SICT Crawler Configuration
site:
  base_url: "https://sict.haui.edu.vn"
  seed_urls:
    - "https://sict.haui.edu.vn/vn"
    - "https://sict.haui.edu.vn/vn/tin-tuc"
    - "https://sict.haui.edu.vn/vn/thong-bao"
    - "https://sict.haui.edu.vn/vn/tuyen-sinh"
    - "https://sict.haui.edu.vn/vn/nghien-cuu-khoa-hoc"
    - "https://sict.haui.edu.vn/vn/thu-vien-anh"
    - "https://sict.haui.edu.vn/vn/html/gioi-thieu"
    - "https://sict.haui.edu.vn/vn/html/bo-may-to-chuc"
    - "https://sict.haui.edu.vn/vn/html/can-bo-giang-vien"
    - "https://sict.haui.edu.vn/vn/html/khoa"
    - "https://sict.haui.edu.vn/vn/html/phong-trung-tam"
    - "https://sict.haui.edu.vn/vn/ke-hoach"
    - "https://sict.haui.edu.vn/vn/tien-do"
    - "https://sict.haui.edu.vn/vn/html/quy-che"
    - "https://sict.haui.edu.vn/vn/tuyen-dung"
    - "https://sict.haui.edu.vn/vn/guong-sang"
    - "https://sict.haui.edu.vn/vn/cau-lac-bo"
  # URL patterns to skip (assets, external)
  skip_patterns:
    - "/dnn/web/haui/assets/"
    - "/Portals/"
    - "\\.css$"
    - "\\.js$"
    - "\\.png$"
    - "\\.jpg$"
    - "\\.jpeg$"
    - "\\.svg$"
    - "\\.ico$"
    - "\\.(doc|docx|xls|xlsx|pdf|zip|rar|ppt|pptx)$"
    - "logout"
    - "/vn/tags"            # trang danh sách theo tag: trùng nội dung, nhiễu (AC-H5)
  # Chỉ crawl sict.haui.edu.vn (chốt 2026-10-12, plan.md Q1). Thêm host vào đây nếu mở rộng phạm vi.
  external_hosts: []

crawl:
  max_depth: 5
  max_pages: 1000
  delay_seconds: 1.0
  timeout_seconds: 30
  user_agent: "SICT-RAG-Crawler/1.0 (contact: admin@haui.edu.vn)"
  respect_robots: true
  listing_max_pages: 5   # incremental: trang danh sách tối đa / mục / lượt (dừng sớm khi 1 trang hết bài lạ)
  max_fetch_retries: 3   # incremental: URL tải lỗi tạm thời được thử lại ở các lượt sau, tối đa N lần

postgres:
  dsn: "postgresql+asyncpg://sict:sict@localhost:5432/sict_crawler"

qdrant:
  host: "localhost"
  port: 6333
  grpc_port: 6334
  prefer_grpc: true
  # index spec v2 (loader.py / indexer.py). Rollback về v1: QDRANT_COLLECTION_TEXT=sict_text
  # QDRANT_COLLECTION_IMAGE=sict_image (chỉ API; worker v2 từ chối ghi vào collection v1).
  collection_text: "sict_text_v2"
  collection_image: "sict_image_v2"
  # caption + OCR ảnh/video; "" = chung collection_text (v1/v2). Index v3: QDRANT_COLLECTION_OCR=sict_ocr_v3
  collection_ocr: ""
  text_dim: 384
  image_dim: 512

redis:
  url: "redis://localhost:6379/0"

celery:
  broker_url: "redis://localhost:6379/1"
  result_url: "redis://localhost:6379/2"

s3:
  bucket: "sict-crawl-media-quyen-ohio"
  region: "us-east-2"
  prefix_raw: "raw/"
  prefix_media: "media/"

embedding:
  text_model: "intfloat/multilingual-e5-small"
  image_model: "openai/clip-vit-base-patch32"
  device: "auto"   # auto: có GPU (CUDA) thì dùng, không thì CPU. Ép tay: cpu | cuda | cuda:1. Env EMBED_DEVICE ghi đè
  batch_size: 32

chunking:
  min_tokens: 200
  max_tokens: 500
  overlap_ratio: 0.1
  semantic: true   # chia câu theo ranh giới ngữ nghĩa (embed e5) khi section quá budget

video:
  scene_threshold: 0.3
  max_keyframes: 20
  min_keyframes: 3
  dedup_threshold: 0.8

vlm:
  enabled: false        # annotate dùng OCR local; VLM chỉ bật lại khi upstream ổn
  api_base: "http://13.236.133.54:20128/v1"
  models:
    - "VLM"
  max_new_tokens: 128
  caption_all: false
  per_page_limit: 10

llm:
  api_base: "http://13.236.133.54:20128/v1"
  model: "sict"
  # model suy luận (glm-5.3, deepseek…) tiêu 300–700 token "suy nghĩ" trước khi trả lời: 256 → không còn chữ nào,
  # /chat rơi về echo ngữ cảnh (đo 2026-10-27, glm-5.3-flash-sale qua kiraai; tham số tắt suy luận bị bỏ qua)
  max_new_tokens: 2048


# Router thành phần câu trả lời (D17). Ngưỡng TẠM — hiệu chỉnh bằng eval/golden (AC-G3, AC-R9).
router:
  clip_min: 0.24
  caption_min: 0.82
  optional_max: 3
  optional_top_docs: 3
  graph_min: 0.6       # media gắn thực thể nêu trong câu hỏi (graph D20): trọng số cạnh tối thiểu

# Guardrail truy xuất không phụ thuộc LLM (D27). Ngưỡng TẠM — hiệu chỉnh bằng eval/golden_v1 + eval/list_v1.
retrieval:
  per_doc_max: 2       # tối đa 2 đoạn / bài trong top k
  dominant_min: 6      # D30: bài chiếm ≥ 6 / 10 hit đầu = câu hỏi nhắm đúng bài đó (min 5: độ phủ list_v1 0,970 → 0,951)
  dominant_doc_max: 4  # … bài đó được tối đa 4 đoạn (thay per_doc_max / 1 của câu liệt kê)
  list_top_k: 10       # câu hỏi liệt kê: ≥ 10 nguồn, mỗi bài 1 đoạn
  min_cosine: 0.45     # 2026-10-25, 89 câu (golden + list_v1): đáp án thấp nhất 0,476, ngoài phạm vi 0,29–0,58
  min_term_cover: 0.8  # đáp án thấp nhất 0,8; chặn 7/8 câu ngoài phạm vi (cùng cosine)
