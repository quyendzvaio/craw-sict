# Compose mở rộng: svc-ocr (node 8GB) + minio (tùy chọn) + cron.
# Dùng kèm docker-compose.yml gốc:
#   docker compose -f docker-compose.yml -f docker-compose.ocr.yml up -d --build
# MinIO thay S3 AWS: set S3_ENDPOINT_URL=http://minio:9000 trong .env
services:
  # Sidecar Obscura: CDP :9222 cho trang JS nặng. CLI 1-shot trong svc-ocr/cron
  # dùng trực tiếp binary, service này chỉ cần khi dùng fetch_cdp / login session.
  # Image ~57MB (distroless), RAM ~30MB — thay Chromium ~200MB+ RAM.
  obscura:
    image: h4ckf0r0day/obscura:latest
    command: ["serve", "--port", "9222"]
    ports: ["127.0.0.1:9222:9222"]
    restart: unless-stopped
    profiles: ["obscura-cdp"]  # bật khi cần: --profile obscura-cdp

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [mindata:/data]
    profiles: ["minio"]  # chỉ bật khi dùng MinIO: --profile minio

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/$${S3_BUCKET:-sict-crawl-media} || true"
    profiles: ["minio"]

  svc-ocr:
    image: sict-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      SICT_CONFIG: /app/config.yaml
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-}}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}  # MinIO: http://minio:9000, AWS: để trống
      CRAWLER_BACKEND: ${CRAWLER_BACKEND:-auto}
      OBSCURA_BIN: /usr/local/bin/obscura
      OBSCURA_CDP: ws://obscura:9222
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql+asyncpg://sict:sict@postgres:5432/sict_crawler}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-120}  # batch ghi (upsert/delete 20k-75k pts) cần deadline dài
      HF_HOME: /cache/hf
      AWS_PROFILE: ${AWS_PROFILE:-quyen-admin}  # S3 qua ~/.aws (không cần key rời)
    depends_on: [postgres, redis, qdrant]
    volumes: [localstore:/app/_local_store, hfcache:/cache/hf, "${AWS_DIR:-${HOME}/.aws}:/home/app/.aws:ro"]
    # chạy 1 lần rồi thoát (k8s Job / cron gọi lại); cron container bên dưới chạy lặp
    command: ["python", "-m", "sict_crawler.main", "--annotate-ocr", "2000"]

  # DEV-ONLY: vòng sleep-loop, mặc định TẮT (profile dev-cron).
  # Prod chạy k8s/CronJob (k8s/cronjob-incremental.yaml) để tránh double-crawl.
  cron:
    profiles: ["dev-cron"]
    image: sict-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      SICT_CONFIG: /app/config.yaml
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-}}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      CRAWLER_BACKEND: ${CRAWLER_BACKEND:-auto}
      OBSCURA_BIN: /usr/local/bin/obscura
      OBSCURA_CDP: ws://obscura:9222
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql+asyncpg://sict:sict@postgres:5432/sict_crawler}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-120}
      AWS_PROFILE: ${AWS_PROFILE:-quyen-admin}
      CHECK_EDITS: ${CHECK_EDITS:-100}
      CRAWL_LIMIT: ${CRAWL_LIMIT:-200}
      ANNOTATE_OCR_N: ${ANNOTATE_OCR_N:-500}
    depends_on: [postgres, redis, qdrant]
    volumes: [localstore:/app/_local_store, hfcache:/cache/hf, "${AWS_DIR:-${HOME}/.aws}:/home/app/.aws:ro"]
    # supercronic-style: dùng sleep loop để không cần thêm image cron
    # mặc định 6h/lần (21600s), override bằng CRON_INTERVAL_SEC khi cần
    command: >
      /bin/sh -c "echo '0 */6 * * *' >/tmp/sched && while true; do
        python -m sict_crawler.main --incremental --check-edits $$CHECK_EDITS --crawl-limit $$CRAWL_LIMIT --annotate-ocr-n $$ANNOTATE_OCR_N;
        sleep $${CRON_INTERVAL_SEC:-21600}; done"

volumes:
  mindata:
  localstore:
  hfcache:
