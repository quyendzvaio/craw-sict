# VM1 = infra + serve (chạy 24/7). Copy file này thành docker-compose.yml trên VM1.
# VM2 worker trỏ về VM1 qua POSTGRES_DSN/REDIS_URL/QDRANT_HOST (xem .env.worker.example).
# D12 (2026-11-01): store có mật khẩu / API key lấy từ .env (POSTGRES_PASSWORD, REDIS_PASSWORD, QDRANT_API_KEY);
# cổng store chỉ mở trên STORE_BIND (mặc định 127.0.0.1: máy dev / 1 máy). VM1 đặt STORE_BIND=0.0.0.0 để VM2 tới
# được — trên EC2 card mạng chỉ có IP private, nên cửa thật là Security Group (chỉ SG của VM2 vào 5432/6379/
# 6333-6334) + mật khẩu. Bỏ trống mật khẩu = như cũ (chỉ dùng cho dev); `scripts/store_auth.sh check vm1` (CD
# chạy trước `up`) chặn deploy khi thiếu.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sict
      # chỉ có tác dụng lúc khởi tạo data dir; đổi mật khẩu DB đã có: `scripts/store_auth.sh sync-pg` (CD gọi)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sict}
      POSTGRES_DB: sict_crawler
    ports: ["${STORE_BIND:-127.0.0.1}:5432:5432"]
    volumes: [./.pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    # Đỉnh đo 148 MiB (2026-11-01); shared_buffers 256 MB + 50 kết nối → 600 MB đủ. Tổng mem_limit VM1 = 3.650 MB
    # (pg 600 + redis 300 + qdrant 1.100 + api 1.500 + nginx 150), chừa ~450 MB cho OS + Alloy trên 4 GB.
    mem_limit: ${PG_MEM_LIMIT:-600m}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl",
              "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports: ["${STORE_BIND:-127.0.0.1}:6379:6379"]
    volumes: [redisdata:/data]
    restart: unless-stopped
    mem_limit: 300m

  qdrant:
    image: qdrant/qdrant:v1.19.1   # ghim (D11): bản đang chứa index v3; nâng = đổi tag có chủ đích
    ports: ["${STORE_BIND:-127.0.0.1}:6333:6333", "${STORE_BIND:-127.0.0.1}:6334:6334"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}   # rỗng = không khoá (dev); /healthz, /readyz không cần khoá
    volumes: [qdata:/qdrant/storage]
    restart: unless-stopped
    # Đỉnh đo 786 MiB (dev giữ v1 + v2 + v3; production giữ v3 + v2 để rollback ≈ tương đương): 900 MB chỉ dư 15 %.
    mem_limit: ${QDRANT_MEM_LIMIT:-1100m}

  api:
    image: ${API_IMAGE:-sict-api:latest}   # CD đặt ghcr.io/…/sict-api:<sha> trong .env (D10); local = build
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn sict_crawler.api.routes:app --host 0.0.0.0 --port 8000
    ports: ["8003:8000"]  # host 8000/8001 đã bị project khác chiếm
    env_file: [{path: .env, required: false}]  # fresh clone chưa có .env vẫn up được (dùng defaults)
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_API_BASE: ${VLM_API_BASE:-}
      VLM_MODELS: ${VLM_MODELS:-}
      VLM_ENABLED: ${VLM_ENABLED:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      # API nói chuyện với store qua mạng compose (tên service), không qua STORE_BIND
      POSTGRES_DSN: postgresql+asyncpg://sict:${POSTGRES_PASSWORD:-sict}@postgres:5432/sict_crawler
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      HF_HOME: /cache/hf  # share model cache, khỏi tải lại E5/CLIP mỗi recreate
      AWS_PROFILE: ${AWS_PROFILE:-quyen-admin}
    depends_on: [postgres, redis, qdrant]
    volumes: [hfcache:/cache/hf, "${AWS_DIR:-${HOME}/.aws}:/home/app/.aws:ro"]
    restart: unless-stopped
    # Index v2 (mặc định, embedding.backend torch): API tự nạp E5 + CLIP → đo 2026-11-01 anon ~820 MiB + ~600 MiB
    # cache file model, chạm 1,5 GB → giữ 1.500 MB. Sau cutover v3 (EMBED_BACKEND=api, embed ở VM2) API chỉ
    # ~200 MiB → đặt API_MEM_LIMIT=600m trong .env, trả ~900 MB cho VM1.
    mem_limit: ${API_MEM_LIMIT:-1500m}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  # L0 edge: reverse proxy + cache truoc api (AC-K1..K5). Nghe 8080,
  # api giu nguyen 8003 de khong vo deploy hien tai; cat-over sau.
  nginx:
    image: nginx:1.31.6-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro", ngcache:/var/cache/nginx]
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 150m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

volumes:
  pgdata:
  qdata:
  hfcache:
  ngcache:
  redisdata:  # persist frontier/seen + heartbeat (restart không mất hàng đợi)
