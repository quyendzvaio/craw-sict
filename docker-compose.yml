services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sict
      POSTGRES_PASSWORD: sict
      POSTGRES_DB: sict_crawler
    ports: ["5432:5432"]
    volumes: [./.pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdata:/qdrant/storage]

  api:
    image: sict-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn sict_crawler.api:app --host 0.0.0.0 --port 8000
    ports: ["8003:8000"]  # host 8000/8001 đã bị project khác chiếm
    env_file: [.env]  # keys test: LLM_API_KEY, VLM_API_KEY, HF_TOKEN (xem .env.example)
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_API_BASE: ${VLM_API_BASE:-}
      VLM_MODELS: ${VLM_MODELS:-}
      VLM_ENABLED: ${VLM_ENABLED:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql+asyncpg://sict:sict@postgres:5432/sict_crawler}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      HF_HOME: /cache/hf  # share model cache, khỏi tải lại E5/CLIP mỗi recreate
      AWS_PROFILE: ${AWS_PROFILE:-quyen-admin}
    depends_on: [postgres, redis, qdrant]
    volumes: [hfcache:/cache/hf, "${HOME}/.aws:/home/app/.aws:ro"]

volumes:
  pgdata:
  qdata:
  hfcache:
