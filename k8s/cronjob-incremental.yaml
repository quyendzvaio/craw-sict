# Auto crawl incremental — job ổn định chạy mỗi 6h.
# Pipeline: initContainer discover (alpine, httpx-only, làm ấm Redis frontier)
# → container worker (slim: recheck sửa/xóa → drain → OCR + E5/CLIP).
# Ổn định nhờ: Forbid (không overlap, thay flock single-host) +
# activeDeadlineSeconds 5h (không lết sang kỳ sau) + idempotency sẵn có
# (content_hash skip, caption!='' skip, frontier:seen dedup).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sict-incremental
  namespace: sict
spec:
  schedule: "0 */6 * * *"  # 00,06,12,18h
  suspend: true  # BẬT cron chỉ khi full crawl ổn (kubectl patch cronjob sict-incremental -n sict --type merge -p '{"spec":{"suspend":false}}')
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 18000  # 5h < chu kỳ 6h
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          nodeSelector: {workload: compute}  # pin VM2 (image sict-worker + RAM 7Gi)
          restartPolicy: OnFailure
          securityContext: {runAsUser: 10000, runAsNonRoot: true}
          initContainers:
            - name: discover
              image: sict-crawl:latest
              imagePullPolicy: IfNotPresent
              env:
                - {name: SICT_CONFIG, value: /app/config.yaml}
              volumeMounts: [{name: config, mountPath: /app/config.yaml, subPath: config.yaml}]
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
          containers:
            - name: worker
              image: sict-worker:latest
              imagePullPolicy: IfNotPresent
              args:
                - python
                - -m
                - sict_crawler.main
                - --incremental
                - --check-edits
                - "100"
                - --crawl-limit
                - "200"
                - --annotate-ocr-n
                - "500"
              env:
                - {name: SICT_CONFIG, value: /app/config.yaml}
                - {name: CRAWLER_BACKEND, value: auto}
                - {name: PGB_USER, valueFrom: {secretKeyRef: {name: sict-postgres, key: user}}}
                - {name: PGB_PASS, valueFrom: {secretKeyRef: {name: sict-postgres, key: password}}}
                - {name: POSTGRES_DSN, value: "postgresql+asyncpg://$(PGB_USER):$(PGB_PASS)@postgres:5432/sict_crawler"}
                - {name: REDIS_URL, value: "redis://redis:6379/0"}
                - {name: QDRANT_HOST, value: qdrant}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: sict-s3, key: access_key_id}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: sict-s3, key: secret_access_key}}
                - name: S3_ENDPOINT_URL
                  valueFrom: {secretKeyRef: {name: sict-s3, key: endpoint_url, optional: true}}
              volumeMounts: [{name: config, mountPath: /app/config.yaml, subPath: config.yaml}]
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {cpu: "2", memory: 7Gi}  # E5+CLIP+tesseract vừa node 8GB
          volumes:
            - name: config
              configMap: {name: sict-config}
          # Gợi ý gán VM (label node rồi uncomment):
          # nodeSelector: {workload: compute}  # c7i-flex.large 4vCPU/8GB?/4GB
---
# One-shot backfill OCR cho ảnh/keyframe cũ — tạo tay 1 lần sau deploy:
#   kubectl create job -n sict sict-ocr-backfill --from=cronjob/sict-incremental
# rồi edit args thành: --annotate-ocr 20000
# (CronJob args mặc định là incremental; override khi create.)
