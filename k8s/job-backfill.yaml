# Backfill OCR 1 lần cho media cũ — KHÔNG apply trực tiếp.
# Dùng: kubectl create job -n sict sict-ocr-backfill --from=cronjob/sict-incremental
# rồi patch args. File này chỉ là template tham khảo khi cần apply tay.
apiVersion: batch/v1
kind: Job
metadata:
  name: sict-ocr-backfill
  namespace: sict
  annotations:
    description: "Manual one-shot. Prefer: kubectl create job --from=cronjob/sict-incremental"
spec:
  activeDeadlineSeconds: 18000
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsUser: 10000, runAsNonRoot: true}
      containers:
        - name: worker
          image: sict-worker:latest
          imagePullPolicy: IfNotPresent
          args: [python, -m, sict_crawler.main, --annotate-ocr, "20000"]
          env:
            - {name: SICT_CONFIG, value: /app/config.yaml}
            - {name: PGB_USER, valueFrom: {secretKeyRef: {name: sict-postgres, key: user}}}
            - {name: PGB_PASS, valueFrom: {secretKeyRef: {name: sict-postgres, key: password}}}
            - {name: POSTGRES_DSN, value: "postgresql+asyncpg://$(PGB_USER):$(PGB_PASS)@postgres:5432/sict_crawler"}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: QDRANT_HOST, value: qdrant}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: sict-s3, key: access_key_id}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: sict-s3, key: secret_access_key}}
            - name: S3_ENDPOINT_URL
              valueFrom: {secretKeyRef: {name: sict-s3, key: endpoint_url, optional: true}}
          volumeMounts: [{name: config, mountPath: /app/config.yaml, subPath: config.yaml}]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 7Gi}
      volumes:
        - name: config
          configMap: {name: sict-config}
