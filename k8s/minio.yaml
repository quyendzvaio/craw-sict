# MinIO optional — chỉ apply khi không dùng AWS S3.
#   kubectl apply -f k8s/minio.yaml
# Khi dùng: S3_ENDPOINT_URL=http://minio:9000 (điền vào Secret sict-s3.endpoint_url),
# key = MINIO_ROOT_USER/PASSWORD bên dưới (đồng bộ vào sict-s3).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: sict
spec:
  selector: {app: minio}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: sict
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          env:
            - {name: MINIO_ROOT_USER, value: "minioadmin"}
            - {name: MINIO_ROOT_PASSWORD, value: "minioadmin"}
          volumeMounts: [{name: mindata, mountPath: /data}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: mindata}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 50Gi}}
