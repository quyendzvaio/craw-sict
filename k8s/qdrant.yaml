# Qdrant giữ vector sict_text (E5 384) + sict_image (CLIP 512).
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: sict
spec:
  selector: {app: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: 6333, nodePort: 30633}
    - {name: grpc, port: 6334, targetPort: 6334, nodePort: 30634}
  type: NodePort  # prometheus (compose monitor) scrape http qua host:30633
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: sict
spec:
  serviceName: qdrant
  replicas: 1
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    spec:
      nodeSelector: {workload: infra}  # local-path PVC ở VM1
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports: [{containerPort: 6333}, {containerPort: 6334}]
          volumeMounts: [{name: qdata, mountPath: /qdrant/storage}]
          readinessProbe:
            httpGet: {path: /, port: 6333}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
  volumeClaimTemplates:
    - metadata: {name: qdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
