# redis:7-alpine — queue frontier + celery broker + cache db3.
# Persist frontier/seen qua PVC (restart không mất hàng đợi).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: sict
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sict
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379, nodePort: 36379}]
  type: NodePort  # redis-exporter (compose monitor) scrape qua host:36379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sict
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      nodeSelector: {workload: infra}  # cùng VM1 với worker-job DNS ổn định
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "512mb",
                 "--maxmemory-policy", "volatile-ttl", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: rdata, mountPath: /data}]
      volumes:
        - name: rdata
          persistentVolumeClaim: {claimName: redis-data}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
