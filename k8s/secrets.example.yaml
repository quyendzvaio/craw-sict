# Mẫu Secret — COPY thành secrets.yaml, điền giá trị thật, KHÔNG commit.
#   cp k8s/secrets.example.yaml k8s/secrets.yaml && kubectl apply -f k8s/secrets.yaml
# AWS S3: endpoint_url để trống "". MinIO trong cluster: "http://minio:9000".
apiVersion: v1
kind: Secret
metadata:
  name: sict-s3
  namespace: sict
stringData:
  access_key_id: "CHANGE-ME"
  secret_access_key: "CHANGE-ME"
  endpoint_url: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: sict-postgres
  namespace: sict
stringData:
  user: "sict"
  password: "CHANGE-ME"
  db: "sict_crawler"
