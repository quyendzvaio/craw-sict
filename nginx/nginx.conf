# Edge cache truoc api: GET /media/* 30 ngay, trang tinh 10 phut,
# POST /query|/chat di thang (chat stream tat buffer). Fail-open khi backend cham.
user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 30;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/event-stream;
    gzip_min_length 500;

    upstream api { server api:8000; keepalive 8; }

    # L0 edge: media bat bien theo media_id (AC-K1) + trang tinh
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:50m
                     max_size=2g inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/page levels=1:2 keys_zone=page:10m
                     max_size=100m inactive=10m use_temp_path=off;

    # Chong spam query/chat theo IP (bao ve worker CPU)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;

        location /nginx-health {
            access_log off;
            return 200 'ok';
        }

        # AC-K1: anh/frame (GET) cache 30 ngay, hong thi serv ban cu (AC-K4)
        location /media/ {
            limit_except GET { deny all; }
            proxy_cache media;
            proxy_cache_key $uri;
            proxy_cache_valid 200 30d;
            proxy_cache_lock on;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating
                                    http_500 http_502 http_503 http_504;
            proxy_ignore_headers Set-Cookie;
            proxy_pass http://api;
        }

        # AC-K1: giao dien + js cache 10 phut
        location = / {
            proxy_cache page;
            proxy_cache_key $uri;
            proxy_cache_valid 200 10m;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating;
            proxy_pass http://api;
        }
        location = /app.js {
            proxy_cache page;
            proxy_cache_key $uri;
            proxy_cache_valid 200 10m;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating;
            proxy_pass http://api;
        }

        # AC-K1: POST khong cache; AC-K5: stream tat buffer
        location /query {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
        }
        location /chat {
            limit_req zone=api burst=20 nodelay;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://api;
        }
    }
}
