[project]
name = "sict-crawler"
version = "0.1.0"
requires-python = ">=3.10"
# Common: pipeline cơ bản — crawl nhẹ + parse + DB + vector + storage.
# Mọi image đều cài nhóm này. ML/API/crawl-render nằm ở dependency-groups.
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "qdrant-client>=1.10",
    "redis>=5.0",
    "boto3>=1.34",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[dependency-groups]
# Test/lint local + CI: uv sync --group dev (KHÔNG dùng pip).
dev = [
    "pytest>=8.0",
]
# API serve: FastAPI. Cần thêm group ml (E5+CLIP cho query).
api = [
    "fastapi>=0.115",
    "prometheus-client>=0.20",   # GET /metrics (D13)
    "uvicorn[standard]>=0.30",
]
# Dịch vụ embedding tự host (D22): jina-clip-v2 ONNX int8 trên CPU, KHÔNG torch (sict_crawler/service/embedding/embed_server.py).
embed = [
    "fastapi>=0.115",
    "prometheus-client>=0.20",   # GET /metrics (D13)
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.20",
    "onnx>=1.16",          # build_towers: tách graph gộp thành tháp chữ / tháp ảnh
    "onnx-ir>=0.1",        # MatMulNBitsQuantizer (int8 chỉ trọng số) cần
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
]
# Worker nặng: embed E5/CLIP + OCR + video keyframes + CDP client cho obscura.
# torch lấy bản CPU (host và container đều không có GPU).
ml = [
    "torch",
    "sentence-transformers>=3.0",
    "transformers>=4.57",
    "pytesseract>=0.3.10",
    "yt-dlp>=2026.8.19",
    "playwright>=1.40",  # chỉ CDP client cho obscura sidecar; KHÔNG chạy `playwright install`
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
