# Danh mục chuẩn CLB / chuỗi sự kiện của graph (D20, sửa 2026-10-18) — DỮ LIỆU, sửa file này, không sửa code.
#
# Mỗi mục là 1 thực thể chuẩn: mọi cách gọi trong `aliases` (khớp bỏ dấu, không phân biệt hoa thường, cả trong
# thân bài) và `acronyms` (viết tắt 1 từ — chỉ khớp ĐÚNG hoa/thường trong bài viết, VD "HIT" chứ không "hit")
# đều quy về nó. Ứng viên luật trích ra (tiêu đề / alt) chứa 1 cách gọi của mục cũng gộp vào mục
# ("Chung kết Cuộc thi Thử thách Lập nghiệp lần thứ VII" → Thử thách Lập nghiệp). Năm bị bỏ khỏi khoá nên chuỗi
# sự kiện hằng năm là 1 thực thể. `block`: khoá luật hay trích nhầm (khẩu hiệu, danh hiệu…) — không thành thực thể.
#
